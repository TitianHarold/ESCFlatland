<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>平面国 · 工作台</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="palette.js" defer></script>
  <script src="character-geometry.js" defer></script><script src="motion.js" defer></script>
  <script src="possibility.js" defer></script><script src="emotions.js" defer></script>
  <script src="camera.js" defer></script><script src="portals.js" defer></script><script src="city-map.js" defer></script><script src="district.js" defer></script><script src="correction-rules.js" defer></script><script src="factory.js" defer></script><script src="dimension.js" defer></script><script src="story-notes.js" defer></script><script src="inner-world.js" defer></script><script src="story-player.js" defer></script><script src="app.js" defer></script>
</head>
<body class="workbench">
  <header class="masthead"><a href="./" target="_blank" class="brand">观看页 ↗</a><span class="edition">平面国 · 工作台</span><nav aria-label="工作台工具"><button id="layers" class="text-button" aria-pressed="false">可能性层</button><button id="references" class="text-button">已选素材 · 20</button></nav></header>
  <main>
    <div class="workbench-scene">
      <section id="stage" class="stage" tabindex="0" aria-label="分镜预览。点击播放一个动作情节，追光时可长按加速，自动播放可在工作台选择。"><canvas id="possibility-world" aria-hidden="true"></canvas><canvas id="outer-world" role="img" aria-label="平面国动作预览"></canvas><div class="grain" aria-hidden="true"></div></section>
      <aside class="shot-notes" aria-label="当前分镜描述" tabindex="0">
        <section><h2>画面</h2><p id="shot-summary">五边形孩子先接近四边形父亲，再接近线段母亲。母亲退开后，检察官冲进屋内。</p></section>
        <section><h2>当前动作</h2><p id="shot-action">三人停留在屋内。孩子位于父母之间，内腔露出下层流动的色域。</p></section>
        <section><h2>镜头</h2><p id="shot-camera">预设固定正交俯视，父母与孩子同框；检察官从门口进入同一画面。</p></section>
      </aside>
    </div>
    <footer class="transport">
      <div class="caption"><span id="phase-number" class="phase-number">01 / 18</span><p id="caption" aria-live="polite">家庭</p></div>
      <div class="timeline"><input id="progress" type="range" min="0" max="15800" value="0" step="1" aria-label="故事进度"><div class="timeline-marks" aria-hidden="true"><span>家庭</span><span>查家</span><span>矫正所</span><span>光出现</span><span>追光</span><span>新维度</span></div></div>
      <div class="control-row"><div class="playback"><div class="playback-modes" role="group" aria-label="推进方式"><button id="mode-interactive" aria-pressed="true" title="点击播放一个情节；追光时可长按加速">点击推进</button><button id="mode-auto" aria-pressed="false">自动播放</button></div><button id="play" class="round-button" aria-label="播放"><span id="play-icon" aria-hidden="true">▶</span></button><button id="restart" class="text-button">重来</button><output id="time">00:00 / 02:38</output></div><div class="chapter-actions"><button id="previous" class="step-button">上一镜</button><select id="chapter" aria-label="选择分镜"></select><button id="next" class="step-button">下一镜</button></div></div>

    </footer>
  </main>
  <dialog id="reference-dialog" aria-labelledby="reference-title"><div class="drawer-header"><h2 id="reference-title">已选素材</h2><button id="close-references" class="round-button" aria-label="关闭素材">×</button></div><div class="reference-groups" id="reference-groups"></div></dialog>
</body>
</html>
