function choose(id,pair){current=id;if(!pair&&id==='015A'&&!choices.has(id))pair=available.find(p=>p.shotId===id);if(pair){if(pair.palette!=='neutral'){palette=pair.palette;P?.setConfig({preset:palette,colors:{}});}choices.set(id,pair.id);}render();}
function renderOverview(){const body=$('overview-body');body.replaceChildren();for(const s of data.shots){const pair=selectedPair(s.id),tr=document.createElement('tr');tr.tabIndex=0;tr.setAttribute('aria-selected',String(s.id===current));const a=document.createElement('td');a.textContent=s.id;const range=document.createElement('span');range.className='range';range.textContent=time(s.start)+'–'+time(s.end)+'s';a.append(range);const b=document.createElement('td');b.textContent=s.title;const c=document.createElement('td'),imgs=document.createElement('div');imgs.className='thumbs';for(const [src,label] of [[pair?.startImage||s.firstImage,'首帧'],[pair?.endImage||s.lastImage,'尾帧']]){const img=document.createElement('img');img.src=src;img.alt=s.id+label;img.loading='lazy';imgs.append(img);}const kind=document.createElement('div');kind.className='frame-kind';kind.textContent=pair?(pair.palette==='neutral'?'':pair.palette+' · ')+'手绘帧':'动作帧';c.append(imgs,kind);tr.append(a,b,c);const go=()=>{choose(s.id);if(innerWidth<781)$('current').scrollIntoView({block:'start'});};tr.addEventListener('click',go);tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});body.append(tr);}}
function artGallery(container,pairs){container.replaceChildren();for(const pair of pairs){const card=document.createElement('article');card.className='card'+(pair.palette===palette?' selected':'');const images=document.createElement('div');images.className='pair-images';for(const [src,label] of [[pair.startImage,'首帧'],[pair.endImage,'尾帧']]){const img=document.createElement('img');img.src=src;img.alt=pair.title+label;img.loading='lazy';img.addEventListener('click',()=>imageDialog(src,pair.title+' · '+label));images.append(img);}const title=document.createElement('h4');title.textContent=pair.title;const button=document.createElement('button');button.textContent='查看';button.addEventListener('click',()=>{setPalette(pair.palette,false);choose(pair.shotId,pair);$('current').scrollIntoView({block:'start'});});card.append(images,title,button);container.append(card);}}
function renderAssets(){const grid=$('character-gallery');for(const asset of data.characterAssets){const fig=document.createElement('figure'),button=document.createElement('button'),img=document.createElement('img');img.src=asset.image;img.alt=asset.title;img.loading='lazy';button.append(img);button.setAttribute('aria-label','放大 '+asset.title);button.addEventListener('click',()=>imageDialog(asset.image,asset.title));const caption=document.createElement('figcaption');caption.textContent=asset.title;const link=document.createElement('a');link.href=asset.image;link.download=asset.image.split('/').pop();link.textContent='下载原图 PNG';fig.append(button,caption,link);grid.append(fig);}}
function renderPreviews(){const grid=$('palette-previews');grid.replaceChildren();for(const frame of data.paletteFrames.filter(f=>(f.preset||f.palette)===palette)){const fig=document.createElement('figure'),b=document.createElement('button'),img=document.createElement('img');img.src=frame.src;img.alt=frame.title+' · '+palette+'动作帧';img.loading='lazy';b.append(img);b.addEventListener('click',()=>imageDialog(frame.src,img.alt));const caption=document.createElement('figcaption');caption.textContent=frame.title+' · '+Number(frame.playbackSeconds).toFixed(0)+'s · '+palette+'动作帧';fig.append(b,caption);grid.append(fig);}}
function render(){const s=byId.get(current),pair=selectedPair(current);$('current-title').textContent=s.id+' · '+s.title;$('current-count').textContent=(data.shots.indexOf(s)+1)+' / '+data.shots.length;$('current-time').textContent=time(s.start)+'–'+time(s.end)+'秒 · 本段'+time(s.duration)+'秒 · 母镜'+s.parentId;$('current-content').textContent=s.content;
const source=$('source-select');source.replaceChildren();const code=document.createElement('option');code.value='code';code.textContent='动作帧';source.append(code);for(const item of available.filter(p=>p.shotId===current)){const o=document.createElement('option');o.value=item.id;o.textContent=item.palette==='neutral'?'手绘帧':'手绘帧 · '+item.palette;source.append(o);}source.value=pair?.id||'code';
for(const [pos,src,description] of [['first',pair?.startImage||s.firstImage,pair?.firstFrameDescription||s.firstFrameDescription],['last',pair?.endImage||s.lastImage,pair?.lastFrameDescription||s.lastFrameDescription]]){$(pos+'-image').src=src;$(pos+'-image').alt=s.id+' '+(pos==='first'?'首帧':'尾帧');$(pos+'-caption').textContent=(pair?'手绘帧':'动作帧')+' · '+(pos==='first'?'首帧':'尾帧');$(pos+'-description').textContent=description;$(pos+'-open').onclick=()=>imageDialog(src,$(pos+'-caption').textContent+' · '+s.id);}
$('prompt-title').textContent='完整视频提示词';$('full-prompt').value=activePrompt(s);$('copy-status').textContent='';resizePrompt();renderOverview();artGallery($('family-gallery'),available.filter(p=>p.shotId==='001B'));renderPreviews();
$('swatches').replaceChildren();for(const color of Object.values(preset().colors)){const swatch=document.createElement('span');swatch.style.background=color;swatch.title=color;$('swatches').append(swatch);}$('palette-select').value=palette;}
function setPalette(id,auto=true){palette=id;const config=P?.getConfig(),colors=config?.preset===id?config.colors:{};const saved=P?.setConfig({preset:id,colors});if(auto){for(const s of data.shots){const pair=preferred(s.id);if(pair)choices.set(s.id,pair.id);else choices.delete(s.id);}}render();if(saved===false)$('copy-status').textContent='配色仅在本次打开时保留。';}
for(const item of data.presets){const o=document.createElement('option');o.value=item.id;o.textContent=item.label;$('palette-select').append(o);}$('palette-select').addEventListener('change',e=>setPalette(e.target.value));$('source-select').addEventListener('change',e=>{const pair=available.find(p=>p.id===e.target.value);if(pair)choose(current,pair);else{choices.set(current,'code');render();}});
$('select-prompt').addEventListener('click',()=>{$('full-prompt').focus();$('full-prompt').select();});$('copy-prompt').addEventListener('click',()=>copy($('full-prompt').value));$('copy-all').addEventListener('click',()=>copy(allText()));$('download-prompt').addEventListener('click',()=>download(current+'-'+palette+'-视频提示词.txt',$('full-prompt').value));$('download-all').addEventListener('click',()=>download('36段视频提示词-'+palette+'.txt',allText()));$('download-csv').addEventListener('click',()=>{const quote=value=>'"'+String(value??'').replaceAll('"','""')+'"',rows=[['子镜ID','开始秒','结束秒','时长秒','内容','首帧','尾帧','来源','完整视频提示词'],...data.shots.map(s=>{const pair=selectedPair(s.id);return[s.id,s.start,s.end,s.duration,s.content,pair?.startImage||s.firstImage,pair?.endImage||s.lastImage,pair?'手绘帧':'动作帧',activePrompt(s)];})];download('分镜制作表-'+palette+'.csv','\uFEFF'+rows.map(r=>r.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8');});
$('image-close').addEventListener('click',()=>$('image-dialog').close());window.addEventListener('resize',resizePrompt);
if(location.protocol==='file:')$('animation-link').href=data.localAnimationHref;else $('animation-link').href=new URL('../workbench.html',location.href).href;
if(palette!=='original')for(const shot of data.shots){const pair=preferred(shot.id);if(pair)choices.set(shot.id,pair.id);}
if(current==='015A'&&!choices.has(current)){const pair=available.find(p=>p.shotId===current);if(pair){if(pair.palette!=='neutral')palette=pair.palette;choices.set(current,pair.id);}}
renderAssets();render();
})();
</script></body></html>
